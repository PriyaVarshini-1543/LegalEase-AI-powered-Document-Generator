services:
  legalease-api:
    build: .
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    ports:
      - "8000:8000"

  legalease-ui:
    build: .
    command: streamlit run app.py --server.address=0.0.0.0 --server.port=8501
    env_file:
      - .env
    environment:
      FRONTEND_API_URL: http://legalease-api:8000
    ports:
      - "8501:8501"
    depends_on:
      - legalease-api
